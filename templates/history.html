{% extends "base.html" %}

{% block content %}
<div style="max-width: 800px; margin: 40px auto; padding: 20px; font-family: sans-serif;">
    <h2 style="color: #0d9488; border-bottom: 2px solid #0d9488; padding-bottom: 10px; margin-bottom: 30px;">Account Activity & History</h2>

    {% if logs %}
        <div style="position: relative; border-left: 2px solid #e2e8f0; padding-left: 20px; margin-left: 10px;">
            {% for log in logs %}
            <div style="margin-bottom: 25px; position: relative;">
                <!-- Timeline Dot -->
                <div style="position: absolute; left: -27px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background-color: #f97316; border: 2px solid white;"></div>
                
                <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                        <strong style="color: #1e293b; font-size: 1.05rem;">{{ log.action_type }}</strong>
                        <span style="font-size: 0.85rem; color: #64748b;">{{ log.timestamp.strftime('%B %d, %Y - %I:%M %p') }}</span>
                    </div>
                    <p style="color: #475569; margin: 0; font-size: 0.95rem; line-height: 1.4;">{{ log.description }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div style="text-align: center; padding: 50px 20px; background: #f8fafc; border-radius: 8px; border: 1px dashed #cbd5e1;">
            <h3 style="color: #475569; margin-bottom: 15px;">No account activity yet.</h3>
        </div>
    {% endif %}
</div>
{% endblock %}
